# Tiny student CNN — KD target. Same architecture family as Fanioudakis but
# narrower channels and smaller FC head. Goal: <5 K params so the INT8
# version is ~5 KB on disk, well inside the ESP32 budget.

data:
  train_npz: data/processed/train.npz
  val_npz: data/processed/val.npz
  test_npz: data/processed/test.npz

model:
  name: cnn_1d
  kwargs:
    channels: [8, 16, 24]
    kernel_sizes: [7, 5, 3]
    fc_hidden: 16
    dropout: 0.2

train:
  seed: 42
  batch_size: 128
  epochs: 25
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adamw
  grad_clip_norm: 1.0
  num_workers: 4
  sampler:
    kind: weighted
  scheduler:
    kind: reduce_on_plateau
    factor: 0.5
    patience: 4
    min_lr: 0.000001
  early_stop:
    enabled: true
    metric: val_macro_f1
    mode: max
    patience: 8
    min_delta: 0.0005
  augment:
    type: wingbeat
    p_noise: 0.5
    p_gain: 0.5
    p_shift: 0.3
    snr_db_min: 0.0
    snr_db_max: 20.0
    gain_min: 0.3
    gain_max: 1.5
    max_shift_frac: 0.1
  class_weight: none

exp:
  name: cnn1d_tiny_distilled
  output_dir: experiments
  save_best_only: true

wandb:
  enabled: true
  project: lyssa-mosquito
  tags: [w11, distillation, tiny_student]
